<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baya.io">
<title>Baya.io Companion · Pair device</title>
<link rel="icon" href="/static/baya-logo.png">
<link rel="apple-touch-icon" href="/static/baya-logo.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .pair { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--soft); }
  .pair .box { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px; width: 100%; max-width: 400px; text-align: center; }
  .pair img { width: 84px; height: 84px; }
  .pair h1 { font-size: 1.45rem; margin: 10px 0 2px; letter-spacing: -.01em; }
  .pair p { color: var(--muted); margin: 0 0 22px; font-size: .95rem; }
  .pin { width: 100%; text-align: center; font-size: 2rem; letter-spacing: .5em; padding: 12px 0 12px .5em; border-radius: 14px; border: 1.5px solid var(--line); outline: none; }
  .pin:focus { border-color: var(--purple); box-shadow: 0 0 0 4px var(--purple-soft); }
  .pair .btn { width: 100%; margin-top: 16px; font-size: 1.05rem; }
  .pair .err { color: #b42318; min-height: 1.4em; margin-top: 12px; font-size: .9rem; }
  .pair small { display: block; margin-top: 18px; color: var(--muted); font-size: .78rem; }
</style>
</head>
<body>
  <div class="pair">
    <form class="box" id="pairForm" autocomplete="off">
      <img src="/static/baya-logo.png" alt="Baya.io pufferfish">
      <h1>Baya.io Companion</h1>
      <p>Enter the 6-digit PIN shown on your PC.</p>
      <input class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="PIN" required>
      <button class="btn btn-primary" type="submit">Pair this device</button>
      <div class="err" id="err" role="alert"></div>
      <small>Local network only. All processing stays on your PC.</small>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
